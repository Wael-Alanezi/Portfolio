about:
  title: نبذة
  text: "أنا طالب هندسة برمجيات في جامعة الأمير سلطان بالرياض، متخصص في الذكاء الاصطناعي وعلوم البيانات. أطمح إلى العمل في أدوار التحول الرقمي وإدارة المنتجات في المؤسسات الكبرى، وأرحّب بفرص التدريب في البرمجيات والبيانات والذكاء الاصطناعي."
